name: Secret & PII Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets and PII
        run: |
          echo "=== Secret & PII Scan ==="
          FAIL=0

          # 1. Subscription IDs / UUIDs assigned to suspicious vars
          if grep -rn --include='*.py' --include='*.sh' --include='*.ps1' --include='*.tf' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.ts' --include='*.js' \
            -E 'subscription[_-]?id\s*[=:]\s*"?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' . --exclude-dir=.git --exclude-dir=node_modules; then
            echo "::error::BLOCKED: Subscription ID detected"
            FAIL=1
          fi

          # 2. Storage account keys
          if grep -rn --include='*.py' --include='*.sh' --include='*.json' --include='*.yml' --include='*.ts' --include='*.js' \
            -E '(account_key|STORAGE_KEY|storage_key)\s*[=:]\s*"[A-Za-z0-9+/]{40,}={0,2}"' . --exclude-dir=.git --exclude-dir=node_modules; then
            echo "::error::BLOCKED: Storage account key detected"
            FAIL=1
          fi

          # 3. SAS tokens in URLs
          if grep -rn --include='*.py' --include='*.sh' --include='*.json' --include='*.yml' --include='*.ts' --include='*.js' \
            -E 'sig=[A-Za-z0-9%+/]{20,}' . --exclude-dir=.git --exclude-dir=node_modules; then
            echo "::error::BLOCKED: SAS token signature detected"
            FAIL=1
          fi

          # 4. AWS keys
          if grep -rn -E '(AKIA[0-9A-Z]{16}|aws_secret_access_key\s*=)' . --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github --exclude='README.md' --exclude='*.example*'; then
            echo "::error::BLOCKED: AWS credential detected"
            FAIL=1
          fi

          # 5. Generic API keys / bearer tokens (long base64-ish strings assigned to suspicious vars)
          if grep -rn --include='*.py' --include='*.sh' --include='*.json' --include='*.ts' --include='*.js' \
            -E '(api_key|API_KEY|token|TOKEN|secret|SECRET)\s*[=:]\s*"[A-Za-z0-9+/]{30,}={0,2}"' . --exclude-dir=.git --exclude-dir=node_modules --exclude='*.example*'; then
            echo "::error::BLOCKED: API key or token detected"
            FAIL=1
          fi

          # 6. Private keys
          if grep -rn -l 'BEGIN.*PRIVATE KEY' . --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github; then
            echo "::error::BLOCKED: Private key file detected"
            FAIL=1
          fi

          # 7. JWT tokens (eyJ... pattern, 100+ chars)
          if grep -rn --include='*.py' --include='*.sh' --include='*.json' --include='*.ts' --include='*.js' --include='*.env' \
            -E 'eyJ[A-Za-z0-9_-]{50,}\.' . --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github; then
            echo "::error::BLOCKED: JWT token detected"
            FAIL=1
          fi

          # 8. Personal paths (Windows user paths with usernames)
          if grep -rn --include='*.py' --include='*.sh' --include='*.ps1' --include='*.json' --include='*.ts' --include='*.js' \
            -E 'C:\\Users\\[a-zA-Z]+\\' . --exclude-dir=.git --exclude-dir=node_modules; then
            echo "::error::BLOCKED: Personal Windows path detected"
            FAIL=1
          fi

          # 9. .env files with secret-like assignments
          if find . -name '.env' -not -path './.git/*' -not -path './node_modules/*' | xargs -r grep -l -E '(KEY|SECRET|TOKEN|PASSWORD)\s*=' 2>/dev/null | grep -v '\.example'; then
            echo "::error::BLOCKED: .env file with secrets detected"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "=========================================="
            echo "PUSH BLOCKED: Fix the above issues first."
            echo "=========================================="
            exit 1
          fi

          echo "All checks passed."
