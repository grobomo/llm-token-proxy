<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Proxy</title>
  <style>
    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --accent:  #58a6ff;
      --green:   #3fb950;
      --yellow:  #d29922;
      --red:     #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 16px; font-weight: 600; color: var(--accent); }
    header .total { color: var(--muted); font-size: 13px; margin-left: auto; }

    .chart-container {
      flex: 1;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
    }
    .chart-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .chart {
      flex: 1;
      min-height: 200px;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      position: relative;
    }
    .bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      cursor: pointer;
      position: relative;
    }
    .bar {
      width: 100%;
      border-radius: 3px 3px 0 0;
      background: var(--accent);
      transition: background 0.15s;
      min-height: 2px;
    }
    .bar-wrap:hover .bar { background: var(--text); }
    .bar-wrap .hour-label {
      font-size: 10px;
      color: var(--muted);
      margin-top: 6px;
      white-space: nowrap;
    }

    .tooltip {
      display: none;
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      min-width: 200px;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .bar-wrap:hover .tooltip { display: block; }
    .tooltip h3 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    .tooltip .cost-total {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .pie-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .pie {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend {
      font-size: 11px;
      line-height: 1.8;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend-cost {
      color: var(--muted);
      margin-left: auto;
      padding-left: 8px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header>
  <h1>Token Proxy</h1>
  <span class="total" id="total-label">—</span>
</header>

<div class="chart-container">
  <div class="chart-label">Hourly spend — last 24 hours</div>
  <div class="chart" id="chart"></div>
</div>

<script>
const COLORS = ['#58a6ff','#3fb950','#d29922','#f85149','#db6d28','#a371f7','#79c0ff','#56d364','#e3b341','#ff7b72'];

function fmtCost(usd) {
  if (!usd || usd === 0) return '$0';
  if (usd < 0.01) return `$${(usd * 100).toFixed(2)}c`;
  if (usd < 1) return `$${usd.toFixed(3)}`;
  return `$${usd.toFixed(2)}`;
}

function buildPieGradient(projects) {
  if (!projects || projects.length === 0) return 'var(--border)';
  const total = projects.reduce((s, p) => s + p.cost, 0);
  if (total === 0) return 'var(--border)';
  let angle = 0;
  const stops = [];
  projects.forEach((p, i) => {
    const pct = (p.cost / total) * 360;
    const color = COLORS[i % COLORS.length];
    stops.push(`${color} ${angle}deg ${angle + pct}deg`);
    angle += pct;
  });
  return `conic-gradient(${stops.join(', ')})`;
}

function renderChart(data) {
  const chart = document.getElementById('chart');
  const hours = data.hours || [];

  if (hours.length === 0) {
    chart.innerHTML = '<div class="empty-state">No data in last 24 hours</div>';
    return;
  }

  const maxCost = Math.max(...hours.map(h => h.total_cost), 0.01);
  const totalCost = hours.reduce((s, h) => s + h.total_cost, 0);
  const totalCalls = hours.reduce((s, h) => s + h.total_calls, 0);
  document.getElementById('total-label').textContent = `${fmtCost(totalCost)} total — ${totalCalls} calls`;

  chart.innerHTML = hours.map(h => {
    const pct = Math.max(1, (h.total_cost / maxCost) * 100);
    const hourStr = h.hour.slice(11, 13) + ':00';
    const nextHour = String((parseInt(h.hour.slice(11, 13)) + 1) % 24).padStart(2, '0') + ':00';
    const color = h.total_cost > maxCost * 0.7 ? 'var(--red)' : h.total_cost > maxCost * 0.4 ? 'var(--yellow)' : 'var(--accent)';

    const pieGradient = buildPieGradient(h.projects);
    const legend = h.projects.slice(0, 6).map((p, i) => `
      <div class="legend-item">
        <div class="legend-dot" style="background:${COLORS[i % COLORS.length]}"></div>
        <span>${p.project}</span>
        <span class="legend-cost">${fmtCost(p.cost)}</span>
      </div>
    `).join('');

    return `
      <div class="bar-wrap">
        <div class="tooltip">
          <h3>${hourStr} – ${nextHour}</h3>
          <div class="cost-total">${fmtCost(h.total_cost)}</div>
          <div class="pie-wrap">
            <div class="pie" style="background:${pieGradient}"></div>
            <div class="legend">${legend}</div>
          </div>
        </div>
        <div class="bar" style="height:${pct}%;background:${color}"></div>
        <span class="hour-label">${hourStr}</span>
      </div>
    `;
  }).join('');
}

async function load() {
  try {
    const r = await fetch('/api/hourly-breakdown');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    renderChart(await r.json());
  } catch (err) {
    document.getElementById('chart').innerHTML = `<div class="empty-state">Error: ${err.message}</div>`;
  }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
