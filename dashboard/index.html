<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Proxy</title>
  <style>
    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --accent:  #58a6ff;
      --green:   #3fb950;
      --yellow:  #d29922;
      --red:     #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 16px; font-weight: 600; color: var(--accent); }
    header .total { color: var(--muted); font-size: 13px; margin-left: auto; }

    .chart-container {
      flex: 1;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
    }
    .chart-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .chart {
      height: 50vh;
      min-height: 250px;
      max-height: 500px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      position: relative;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      min-width: 36px;
      justify-content: flex-end;
      cursor: pointer;
      position: relative;
    }
    @media (max-width: 600px) {
      .chart { gap: 1px; min-height: 200px; }
      .bar-wrap { min-width: 28px; }
    }
    .bar {
      width: 100%;
      border-radius: 3px 3px 0 0;
      background: var(--accent);
      transition: background 0.15s;
      min-height: 2px;
    }
    .bar-wrap:hover .bar { background: var(--text); }
    .bar-wrap .hour-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      margin-top: 8px;
      white-space: nowrap;
    }
    @media (min-width: 900px) {
      .bar-wrap .hour-label { font-size: 14px; }
    }

    .tooltip {
      display: none;
      position: fixed;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      min-width: 200px;
      max-width: 280px;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      pointer-events: none;
    }
    .tooltip h3 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    .tooltip .cost-total {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .pie-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .pie {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend {
      font-size: 11px;
      line-height: 1.8;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend-cost {
      color: var(--muted);
      margin-left: auto;
      padding-left: 8px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }

    .breakdown {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) {
      .breakdown { grid-template-columns: 1fr; padding: 12px; }
    }
    .breakdown-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .breakdown-card h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .model-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .model-row:last-child { border-bottom: none; }
    .model-name { flex: 1; font-size: 13px; }
    .model-cost { font-weight: 600; font-size: 13px; }
    .model-calls { color: var(--muted); font-size: 12px; min-width: 60px; text-align: right; }
    .model-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>

<header>
  <h1>Token Proxy</h1>
  <span class="total" id="total-label">—</span>
</header>

<div class="chart-container">
  <div class="chart-label">Hourly spend — last 24 hours</div>
  <div class="chart" id="chart"></div>
</div>

<div class="breakdown">
  <div class="breakdown-card">
    <h3>Cost by model — 24h</h3>
    <div id="model-breakdown"></div>
  </div>
  <div class="breakdown-card">
    <h3>Cache economics — 24h</h3>
    <div class="stat-grid" id="cache-stats"></div>
  </div>
</div>

<script>
const COLORS = ['#58a6ff','#3fb950','#d29922','#f85149','#db6d28','#a371f7','#79c0ff','#56d364','#e3b341','#ff7b72'];

function fmtCost(usd) {
  if (!usd || usd === 0) return '$0';
  if (usd < 0.01) return `$${(usd * 100).toFixed(2)}c`;
  if (usd < 1) return `$${usd.toFixed(3)}`;
  return `$${usd.toFixed(2)}`;
}

function buildPieGradient(projects) {
  if (!projects || projects.length === 0) return 'var(--border)';
  const total = projects.reduce((s, p) => s + p.cost, 0);
  if (total === 0) return 'var(--border)';
  let angle = 0;
  const stops = [];
  projects.forEach((p, i) => {
    const pct = (p.cost / total) * 360;
    const color = COLORS[i % COLORS.length];
    stops.push(`${color} ${angle}deg ${angle + pct}deg`);
    angle += pct;
  });
  return `conic-gradient(${stops.join(', ')})`;
}

function renderChart(data) {
  const chart = document.getElementById('chart');
  const hours = data.hours || [];

  if (hours.length === 0) {
    chart.innerHTML = '<div class="empty-state">No data in last 24 hours</div>';
    return;
  }

  const maxCost = Math.max(...hours.map(h => h.total_cost), 0.01);
  const totalCost = hours.reduce((s, h) => s + h.total_cost, 0);
  const totalCalls = hours.reduce((s, h) => s + h.total_calls, 0);
  document.getElementById('total-label').textContent = `${fmtCost(totalCost)} total — ${totalCalls} calls`;

  // Convert UTC hour to CDT (UTC-5)
  function utcToCdt(utcHour) { return (utcHour - 5 + 24) % 24; }
  function fmtHour(h) { const hr12 = h % 12 || 12; return `${hr12}:00${h < 12 ? 'a' : 'p'}`; }

  chart.innerHTML = hours.map(h => {
    const pct = Math.max(1, (h.total_cost / maxCost) * 100);
    const utcH = parseInt(h.hour.slice(11, 13));
    const cdtH = utcToCdt(utcH);
    const cdtLabel = fmtHour(cdtH);
    const cdtNext = fmtHour((cdtH + 1) % 24);
    const color = h.total_cost > maxCost * 0.7 ? 'var(--red)' : h.total_cost > maxCost * 0.4 ? 'var(--yellow)' : 'var(--accent)';

    const pieGradient = buildPieGradient(h.projects);
    const legend = h.projects.slice(0, 6).map((p, i) => `
      <div class="legend-item">
        <div class="legend-dot" style="background:${COLORS[i % COLORS.length]}"></div>
        <span>${p.project}</span>
        <span class="legend-cost">${fmtCost(p.cost)}</span>
      </div>
    `).join('');

    return `
      <div class="bar-wrap" data-tooltip-content="${cdtLabel}–${cdtNext} CDT | ${fmtCost(h.total_cost)}">
        <div class="tooltip">
          <h3>${cdtLabel}–${cdtNext} CDT</h3>
          <div class="cost-total">${fmtCost(h.total_cost)}</div>
          <div class="pie-wrap">
            <div class="pie" style="background:${pieGradient}"></div>
            <div class="legend">${legend}</div>
          </div>
        </div>
        <div class="bar" style="height:${pct}%;background:${color}"></div>
        <span class="hour-label">${cdtLabel}</span>
      </div>
    `;
  }).join('');

  // Position tooltips on hover/tap (fixed positioning avoids clipping)
  let activeTooltip = null;
  function showTip(wrap) {
    if (activeTooltip) activeTooltip.style.display = 'none';
    const tip = wrap.querySelector('.tooltip');
    const rect = wrap.getBoundingClientRect();
    tip.style.display = 'block';
    const tipRect = tip.getBoundingClientRect();
    let left = rect.left + rect.width / 2 - tipRect.width / 2;
    let top = rect.top - tipRect.height - 8;
    if (left < 8) left = 8;
    if (left + tipRect.width > window.innerWidth - 8) left = window.innerWidth - tipRect.width - 8;
    if (top < 8) top = rect.bottom + 8;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    activeTooltip = tip;
  }
  function hideTip() { if (activeTooltip) { activeTooltip.style.display = 'none'; activeTooltip = null; } }

  chart.querySelectorAll('.bar-wrap').forEach(wrap => {
    wrap.addEventListener('mouseenter', () => showTip(wrap));
    wrap.addEventListener('mouseleave', hideTip);
    wrap.addEventListener('touchstart', (e) => { e.preventDefault(); showTip(wrap); }, { passive: false });
  });
  document.addEventListener('touchstart', (e) => {
    if (activeTooltip && !e.target.closest('.bar-wrap')) hideTip();
  });
}

async function load() {
  try {
    const r = await fetch('/api/hourly-breakdown');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    renderChart(await r.json());
  } catch (err) {
    document.getElementById('chart').innerHTML = `<div class="empty-state">Error: ${err.message}</div>`;
  }
}

function shortModel(name) {
  return name.replace(/^claude-/, '').replace(/-20\d{6}$/, '');
}

function fmtTokens(n) {
  if (!n) return '0';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
  return String(n);
}

function renderBreakdown(data) {
  const el = document.getElementById('model-breakdown');
  const models = (data.models || []).filter(m => m.cost > 0.01);

  if (models.length === 0) {
    el.innerHTML = '<div class="empty-state">No data</div>';
    return;
  }

  el.innerHTML = models.map((m, i) => `
    <div class="model-row">
      <div class="model-dot" style="background:${COLORS[i % COLORS.length]}"></div>
      <span class="model-name">${shortModel(m.model)}</span>
      <span class="model-calls">${m.calls} calls</span>
      <span class="model-cost">${fmtCost(m.cost)}</span>
    </div>
  `).join('');

  const stats = document.getElementById('cache-stats');
  const t = data.totals || {};
  stats.innerHTML = `
    <div class="stat-item">
      <div class="stat-value">${fmtTokens(t.cache_write)}</div>
      <div class="stat-label">Cache write</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">${fmtTokens(t.cache_read)}</div>
      <div class="stat-label">Cache read</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">${fmtCost(t.cache_write * 18.75 / 1e6)}</div>
      <div class="stat-label">Write cost est.</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">${t.cache_read > 0 ? Math.round(t.cache_read / Math.max(t.cache_write, 1)) + 'x' : '—'}</div>
      <div class="stat-label">Read/write ratio</div>
    </div>
  `;
}

async function loadBreakdown() {
  try {
    const r = await fetch('/api/cost-breakdown');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    renderBreakdown(await r.json());
  } catch (err) {
    document.getElementById('model-breakdown').innerHTML = `<div class="empty-state">${err.message}</div>`;
  }
}

load();
loadBreakdown();
setInterval(load, 60000);
setInterval(loadBreakdown, 60000);
</script>
</body>
</html>
