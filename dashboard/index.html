<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230d1117' stroke='%2358a6ff' stroke-width='2'/><text x='16' y='21' text-anchor='middle' font-size='14' font-family='monospace' fill='%2358a6ff'>T</text></svg>" />
  <title>Token Tracker</title>
  <style>
    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --accent:  #58a6ff;
      --green:   #3fb950;
      --yellow:  #d29922;
      --red:     #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 16px; font-weight: 600; color: var(--accent); }
    header .total { color: var(--muted); font-size: 13px; margin-left: auto; }

    .health-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
    }
    .health-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .health-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    .health-dot.up { background: var(--green); }
    .health-dot.down { background: var(--red); animation: blink 1s infinite; }
    .health-dot.unknown { background: var(--muted); }
    .health-label { color: var(--muted); }
    .health-status { font-weight: 600; }
    .health-status.up { color: var(--green); }
    .health-status.down { color: var(--red); }
    .health-ts { color: var(--muted); margin-left: auto; font-size: 11px; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

    .chart-container {
      flex: 1;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
    }
    .chart-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .chart {
      height: 50vh;
      min-height: 250px;
      max-height: 500px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      position: relative;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .bar-wrap {
      flex: 1 1 0;
      min-width: 44px;
      max-width: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      cursor: pointer;
      position: relative;
    }
    @media (max-width: 600px) {
      .chart { gap: 1px; min-height: 200px; }
      .bar-wrap { width: 56px; }
    }
    .bar-stack {
      width: 100%;
      border-radius: 3px 3px 0 0;
      overflow: hidden;
      min-height: 2px;
      display: flex;
      flex-direction: column-reverse;
    }
    .bar-segment {
      width: 100%;
      transition: opacity 0.15s;
    }
    .bar-wrap:hover .bar-stack { opacity: 0.85; }
    .bar-wrap .hour-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      margin-top: 8px;
      white-space: nowrap;
    }
    @media (min-width: 900px) {
      .bar-wrap .hour-label { font-size: 14px; }
    }

    .tooltip {
      display: none;
      position: fixed;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      min-width: 200px;
      max-width: 280px;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      pointer-events: none;
    }
    .tooltip h3 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    .tooltip .cost-total {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .pie-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .pie {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend {
      font-size: 11px;
      line-height: 1.8;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend-cost {
      color: var(--muted);
      margin-left: auto;
      padding-left: 8px;
    }

    .loading .breakdown-card > div:not(h3) { opacity: 0.4; transition: opacity 0.2s; }
    .loading .chart { opacity: 0.4; transition: opacity 0.2s; }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }

    .breakdown {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) {
      .breakdown { grid-template-columns: 1fr; padding: 12px; }
    }
    .breakdown-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .breakdown-card h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .model-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .model-row:last-child { border-bottom: none; }
    .model-name { flex: 1; font-size: 13px; }
    .model-cost { font-weight: 600; font-size: 13px; }
    .model-calls { color: var(--muted); font-size: 12px; min-width: 60px; text-align: right; }
    .model-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>

<header>
  <h1>Token Tracker</h1>
  <select id="range-select" style="background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:12px;cursor:pointer">
    <option value="1h">1h</option>
    <option value="6h">6h</option>
    <option value="12h">12h</option>
    <option value="24h" selected>24h</option>
    <option value="7d">7d</option>
    <option value="30d">30d</option>
  </select>
  <span class="total" id="trend-label"></span>
  <span class="total" id="total-label">—</span>
  <span class="total" id="last-refresh" style="font-size:11px"></span>
  <button id="export-btn" title="Export CSV" style="background:var(--bg);color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:12px;cursor:pointer" onclick="exportCSV()">CSV</button>
</header>

<div class="health-bar" id="health-bar">
  <div class="health-item">
    <div class="health-dot up"></div>
    <span class="health-label">Proxy</span>
    <span class="health-status up">running</span>
  </div>
  <div id="health-upstreams"></div>
  <span class="health-ts" id="health-ts"></span>
  <span class="health-ts" id="health-stale" style="display:none;color:var(--yellow)">stale</span>
</div>

<div class="chart-container">
  <div class="chart-label" id="chart-label">Hourly spend — last 24 hours</div>
  <div class="chart" id="chart"></div>
</div>

<div class="breakdown">
  <div class="breakdown-card">
    <h3 class="range-label">Cost by model — 24h</h3>
    <div id="model-breakdown"></div>
  </div>
  <div class="breakdown-card">
    <h3 class="range-label">Cache economics — 24h</h3>
    <div class="stat-grid" id="cache-stats"></div>
  </div>
</div>

<div class="breakdown">
  <div class="breakdown-card" style="grid-column: span 2">
    <h3 class="range-label">Top projects — 24h</h3>
    <div id="project-costs"></div>
  </div>
</div>

<div class="breakdown">
  <div class="breakdown-card" style="grid-column: span 2">
    <h3 class="range-label">Sessions — 24h</h3>
    <div id="sessions-panel"></div>
  </div>
</div>

<div class="breakdown">
  <div class="breakdown-card" style="grid-column: span 2">
    <h3 class="range-label">Cost optimization — 24h</h3>
    <div id="savings-panel"></div>
  </div>
</div>

<div class="breakdown">
  <div class="breakdown-card" style="grid-column: span 2">
    <h3 class="range-label">Judge decisions — 24h</h3>
    <div id="judge-panel"></div>
  </div>
</div>

<script>
const COLORS = ['#58a6ff','#3fb950','#d29922','#f85149','#db6d28','#a371f7','#79c0ff','#56d364','#e3b341','#ff7b72'];

function shortModel(name) {
  const short = esc(name.replace(/^claude-/, '').replace(/-20\d{6}$/, ''));
  if (name.includes('-aws')) return short + ' <span style="opacity:0.5;font-size:10px">[RDsec]</span>';
  if (name.includes('opus') || name.includes('sonnet') || name.includes('haiku')) return short + ' <span style="opacity:0.5;font-size:10px">[C4E]</span>';
  return short;
}

// Stable model→color map built from full dataset
function buildModelColorMap(hours) {
  const totals = {};
  for (const h of hours) {
    for (const m of (h.models || [])) {
      totals[m.model] = (totals[m.model] || 0) + m.cost;
    }
  }
  const sorted = Object.keys(totals).sort((a, b) => totals[b] - totals[a]);
  const map = {};
  sorted.forEach((model, i) => { map[model] = COLORS[i % COLORS.length]; });
  return map;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function rangeParam() { return document.getElementById('range-select').value; }
function apiUrl(path) { return `${path}${path.includes('?') ? '&' : '?'}range=${rangeParam()}`; }
function rangeLabel() { return rangeParam(); }

function fmtCost(usd) {
  if (!usd || usd === 0) return '$0';
  if (usd < 0.01) return `$${usd.toFixed(4)}`;
  if (usd < 1) return `$${usd.toFixed(3)}`;
  return `$${usd.toFixed(2)}`;
}


function renderChart(data) {
  const chart = document.getElementById('chart');
  const hours = data.hours || [];

  if (hours.length === 0) {
    chart.innerHTML = '<div class="empty-state">No data in last 24 hours</div>';
    return;
  }

  const modelColors = buildModelColorMap(hours);
  const maxCost = Math.max(...hours.map(h => h.total_cost), 0.01);
  const totalCost = hours.reduce((s, h) => s + h.total_cost, 0);
  const totalCalls = hours.reduce((s, h) => s + h.total_calls, 0);
  document.getElementById('total-label').textContent = `${fmtCost(totalCost)} last 24h — ${totalCalls} calls`;

  function utcToCdt(utcHour) { return (utcHour - 5 + 24) % 24; }
  function fmtHour(h) { const hr12 = h % 12 || 12; return `${hr12}:00${h < 12 ? 'a' : 'p'}`; }

  chart.innerHTML = hours.map(h => {
    const barPct = Math.max(1, (h.total_cost / maxCost) * 100);
    const utcH = parseInt(h.hour.slice(11, 13));
    const cdtH = utcToCdt(utcH);
    const cdtLabel = fmtHour(cdtH);
    const cdtNext = fmtHour((cdtH + 1) % 24);

    const models = (h.models || []).sort((a, b) => b.cost - a.cost);
    const segments = models.map(m => {
      const segPct = h.total_cost > 0 ? (m.cost / h.total_cost) * 100 : 0;
      return `<div class="bar-segment" style="height:${segPct}%;background:${modelColors[m.model] || 'var(--accent)'}"></div>`;
    }).join('');

    const legend = models.slice(0, 6).map(m => `
      <div class="legend-item">
        <div class="legend-dot" style="background:${modelColors[m.model] || 'var(--accent)'}"></div>
        <span>${shortModel(m.model)}</span>
        <span class="legend-cost">${fmtCost(m.cost)}</span>
      </div>
    `).join('');

    return `
      <div class="bar-wrap">
        <div class="tooltip">
          <h3>${cdtLabel}–${cdtNext} CDT</h3>
          <div class="cost-total">${fmtCost(h.total_cost)}</div>
          <div class="legend">${legend}</div>
        </div>
        <div class="bar-stack" style="height:${barPct}%">${segments}</div>
        <span class="hour-label">${cdtLabel}</span>
      </div>
    `;
  }).join('');

  // Position tooltips on hover/tap (fixed positioning avoids clipping)
  let activeTooltip = null;
  function showTip(wrap) {
    if (activeTooltip) activeTooltip.style.display = 'none';
    const tip = wrap.querySelector('.tooltip');
    const rect = wrap.getBoundingClientRect();
    tip.style.display = 'block';
    const tipRect = tip.getBoundingClientRect();
    let left = rect.left + rect.width / 2 - tipRect.width / 2;
    let top = rect.top - tipRect.height - 8;
    if (left < 8) left = 8;
    if (left + tipRect.width > window.innerWidth - 8) left = window.innerWidth - tipRect.width - 8;
    if (top < 8) top = rect.bottom + 8;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    activeTooltip = tip;
  }
  function hideTip() { if (activeTooltip) { activeTooltip.style.display = 'none'; activeTooltip = null; } }

  chart.querySelectorAll('.bar-wrap').forEach(wrap => {
    wrap.addEventListener('mouseenter', () => showTip(wrap));
    wrap.addEventListener('mouseleave', hideTip);
    let touchMoved = false;
    wrap.addEventListener('touchstart', () => { touchMoved = false; }, { passive: true });
    wrap.addEventListener('touchmove', () => { touchMoved = true; }, { passive: true });
    wrap.addEventListener('touchend', (e) => {
      if (!touchMoved) { e.preventDefault(); showTip(wrap); }
    });
  });
  document.addEventListener('touchstart', (e) => {
    if (activeTooltip && !e.target.closest('.bar-wrap')) hideTip();
  }, { passive: true });

  // Auto-scroll to most recent (rightmost) bars
  chart.scrollLeft = chart.scrollWidth;
}

async function load() {
  try {
    const r = await fetch(apiUrl('/api/hourly-breakdown'));
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    renderChart(await r.json());
  } catch (err) {
    document.getElementById('chart').innerHTML = `<div class="empty-state">Error: ${esc(err.message)}</div>`;
  }
}

function fmtTokens(n) {
  if (!n) return '0';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
  return String(n);
}

function renderBreakdown(data) {
  const el = document.getElementById('model-breakdown');
  const models = (data.models || []).filter(m => m.cost > 0.01);

  if (models.length === 0) {
    el.innerHTML = '<div class="empty-state">No data</div>';
    return;
  }

  el.innerHTML = models.map((m, i) => `
    <div class="model-row">
      <div class="model-dot" style="background:${COLORS[i % COLORS.length]}"></div>
      <span class="model-name">${shortModel(m.model)}</span>
      <span class="model-calls">${m.calls} calls</span>
      <span class="model-cost">${fmtCost(m.cost)}</span>
    </div>
  `).join('');

  const stats = document.getElementById('cache-stats');
  const t = data.totals || {};
  const estBadge = t.estimated_calls > 0 ? ` <span style="font-size:0.6em;color:var(--yellow);vertical-align:super" title="${t.estimated_calls} calls used heuristic estimation">est</span>` : '';
  stats.innerHTML = `
    <div class="stat-item">
      <div class="stat-value">${fmtTokens(t.cache_write)}${estBadge}</div>
      <div class="stat-label">Cache write</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">${fmtTokens(t.cache_read)}${estBadge}</div>
      <div class="stat-label">Cache read</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">${fmtCost(t.cache_write * 18.75 / 1e6)}</div>
      <div class="stat-label">Write cost est.</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">${t.cache_read > 0 ? Math.round(t.cache_read / Math.max(t.cache_write, 1)) + 'x' : '—'}</div>
      <div class="stat-label">Read/write ratio</div>
    </div>
  `;
}

async function loadBreakdown() {
  try {
    const r = await fetch(apiUrl('/api/cost-breakdown'));
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    renderBreakdown(await r.json());
  } catch (err) {
    document.getElementById('model-breakdown').innerHTML = `<div class="empty-state">${esc(err.message)}</div>`;
  }
}

function renderSavings(data) {
  const el = document.getElementById('savings-panel');
  const ss = data.session_restarts || {};
  const restartCost = 2.33;
  const freshCostPerMsg = 0.03;
  const avgContext = 134000;
  const largeCostPerMsg = avgContext * 1.50 / 1e6;
  const savingPerMsg = largeCostPerMsg - freshCostPerMsg;
  const breakEven = Math.ceil(restartCost / savingPerMsg);

  el.innerHTML = `
    <div style="display:flex;gap:24px;margin-bottom:12px;flex-wrap:wrap">
      <div class="stat-item">
        <div class="stat-value">${ss.count || 0}</div>
        <div class="stat-label">Restarts (24h)</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" style="color:var(--yellow)">${fmtCost(ss.cache_write_cost || 0)}</div>
        <div class="stat-label">Restart cost</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">${fmtCost(largeCostPerMsg)}</div>
        <div class="stat-label">Cost/msg at 134K ctx</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" style="color:var(--green)">${breakEven}</div>
        <div class="stat-label">Break-even msgs</div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--muted);line-height:1.6">
      Tradeoff: restart costs $${restartCost.toFixed(2)} (cache_write) but resets context to ~20K ($${freshCostPerMsg.toFixed(2)}/msg).
      Without restart, context grows to ~134K ($${largeCostPerMsg.toFixed(2)}/msg).
      After ${breakEven} messages, a fresh session pays for itself.
    </div>
  `;
}

async function loadSavings() {
  try {
    const r = await fetch(apiUrl('/api/savings-potential'));
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    renderSavings(await r.json());
  } catch (err) {
    document.getElementById('savings-panel').innerHTML = `<div class="empty-state">${esc(err.message)}</div>`;
  }
}

async function loadTrend() {
  try {
    const tzOffset = new Date().getTimezoneOffset(); // minutes (positive = behind UTC)
    const r = await fetch(`/api/daily-comparison?tz_offset=${-tzOffset}`);
    if (!r.ok) return;
    const d = await r.json();
    const el = document.getElementById('trend-label');
    // Use local timezone for "today" boundary instead of UTC
    const localToday = new Date().toLocaleDateString('sv'); // YYYY-MM-DD in local tz
    const localYesterday = new Date(Date.now() - 86400000).toLocaleDateString('sv');
    const todayCost = d.today?.cost || 0;
    const yesterdayCost = d.yesterday?.cost || 0;
    const tzLabel = new Date().toLocaleTimeString('en-US', {timeZoneName: 'short'}).split(' ').pop();
    if (yesterdayCost > 0) {
      el.textContent = `today ${fmtCost(todayCost)} / yesterday ${fmtCost(yesterdayCost)} (${tzLabel})`;
    } else {
      el.textContent = `today ${fmtCost(todayCost)} (${tzLabel})`;
    }
  } catch {}
}

let lastHealthCheck = 0;
let lastHealthSuccess = null;

async function loadHealth() {
  const upstreamsEl = document.getElementById('health-upstreams');
  const tsEl = document.getElementById('health-ts');
  const staleEl = document.getElementById('health-stale');

  try {
    const r = await fetch('/diagnose');
    const d = await r.json();
    lastHealthCheck = Date.now();
    lastHealthSuccess = d.ts;
    staleEl.style.display = 'none';

    const upstreamHtml = Object.entries(d.upstreams || {}).map(([name, status]) => {
      const cls = status === 'reachable' ? 'up' : 'down';
      const label = status === 'reachable' ? 'up' : 'unreachable';
      const tooltip = status === 'reachable'
        ? `title="${name}: healthy"`
        : `title="${name}: connection failed. Last OK: ${lastHealthSuccess || 'never'}"`;
      return `<div class="health-item" ${tooltip}><div class="health-dot ${cls}"></div><span class="health-label">${name}</span><span class="health-status ${cls}">${label}</span></div>`;
    }).join('');
    upstreamsEl.innerHTML = upstreamHtml;
    tsEl.textContent = 'checked ' + new Date().toLocaleTimeString();
  } catch (err) {
    lastHealthCheck = Date.now();
    upstreamsEl.innerHTML = `<div class="health-item" title="${esc(err.message)}"><div class="health-dot down"></div><span class="health-label">API upstreams</span><span class="health-status down">check failed</span></div>`;
    tsEl.textContent = 'error ' + new Date().toLocaleTimeString();
    staleEl.style.display = 'none';
  }
}

// Staleness detection: mark stale if last check was >30s ago (tab backgrounded)
setInterval(() => {
  const staleEl = document.getElementById('health-stale');
  if (lastHealthCheck && Date.now() - lastHealthCheck > 30000) {
    staleEl.style.display = 'inline';
  }
}, 5000);

// Force refresh on tab focus (browser throttles setInterval when backgrounded)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { loadHealth(); refreshAll(); loadTrend(); loadJudge(); }
});

async function loadJudge() {
  const el = document.getElementById('judge-panel');
  try {
    const r = await fetch('/api/judge-stats');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const gates = d.by_gate || [];
    const recent = d.recent || [];

    if (gates.length === 0 && recent.length === 0) {
      el.innerHTML = '<div class="empty-state" style="padding:12px">No judge decisions yet</div>';
      return;
    }

    const gateRows = gates.map(g => `
      <div class="model-row">
        <span class="model-name">${esc(g.gate)}</span>
        <span style="color:var(--green);font-size:12px">${g.allowed} allow</span>
        <span style="color:var(--red);font-size:12px">${g.blocked} block</span>
        <span class="model-calls">${g.avg_latency_ms}ms avg</span>
        <span class="model-cost">${g.total} total</span>
      </div>
    `).join('');

    const recentRows = recent.slice(0, 5).map(r => `
      <div class="model-row" style="font-size:11px">
        <span style="color:${r.decision === 'allow' ? 'var(--green)' : 'var(--red)'}">${esc(r.decision)}</span>
        <span class="model-name">${esc(r.gate)}</span>
        <span style="color:var(--muted)">${esc(r.reason?.slice(0, 50) || '')}</span>
      </div>
    `).join('');

    el.innerHTML = gateRows + (recentRows ? '<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px"><div style="font-size:10px;color:var(--muted);margin-bottom:4px">RECENT</div>' + recentRows + '</div>' : '');
  } catch { el.innerHTML = '<div class="empty-state" style="padding:12px">—</div>'; }
}

async function loadProjectCosts() {
  const el = document.getElementById('project-costs');
  try {
    const r = await fetch(apiUrl('/api/project-costs'));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const projects = d.projects || [];

    if (projects.length === 0) {
      el.innerHTML = '<div class="empty-state" style="padding:12px">No project data</div>';
      return;
    }

    const maxCost = projects[0]?.cost || 1;
    el.innerHTML = projects.map((p, i) => {
      const pct = Math.max(2, (p.cost / maxCost) * 100);
      const name = p.project.replace(/^.*[/\\]/, '');  // show just dir name
      return `
        <div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px">
          <span style="width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(p.project)}">${esc(name)}</span>
          <div style="flex:1;height:14px;background:var(--border);border-radius:3px;overflow:hidden">
            <div style="width:${pct}%;height:100%;background:${COLORS[i % COLORS.length]};border-radius:3px"></div>
          </div>
          <span style="min-width:50px;text-align:right;color:var(--muted)">${p.calls}</span>
          <span style="min-width:60px;text-align:right;font-weight:600">${fmtCost(p.cost)}</span>
        </div>`;
    }).join('');
  } catch { el.innerHTML = '<div class="empty-state" style="padding:12px">—</div>'; }
}

async function loadSessions() {
  const el = document.getElementById('sessions-panel');
  try {
    const r = await fetch(apiUrl('/api/sessions'));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const sessions = d.sessions || [];
    if (sessions.length === 0) {
      el.innerHTML = '<div class="empty-state" style="padding:12px">No sessions in this range</div>';
      return;
    }
    const maxCost = sessions[0]?.cost || 1;
    el.innerHTML = sessions.map((s, i) => {
      const pct = Math.max(2, (s.cost / maxCost) * 100);
      const sid = (s.session_id || '').slice(0, 8);
      const proj = s.project.replace(/^.*[/\\]/, '');
      const dur = s.duration_min != null ? `${s.duration_min}m` : '—';
      const models = (s.models || []).map(m => esc(m.replace(/^claude-/, '').replace(/-20\d{6}$/, ''))).join(', ');
      return `
        <div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px">
          <span style="width:60px;font-family:monospace;color:var(--accent);font-size:11px" title="${esc(s.session_id)}">${esc(sid)}</span>
          <span style="width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)" title="${esc(s.project)}">${esc(proj)}</span>
          <div style="flex:1;height:14px;background:var(--border);border-radius:3px;overflow:hidden">
            <div style="width:${pct}%;height:100%;background:${COLORS[i % COLORS.length]};border-radius:3px"></div>
          </div>
          <span style="min-width:40px;text-align:right;color:var(--muted);font-size:11px">${s.calls}</span>
          <span style="min-width:40px;text-align:right;color:var(--muted);font-size:11px">${dur}</span>
          <span style="min-width:55px;text-align:right;font-weight:600">${fmtCost(s.cost)}</span>
        </div>`;
    }).join('');
  } catch { el.innerHTML = '<div class="empty-state" style="padding:12px">—</div>'; }
}

function refreshAll() {
  const rl = rangeLabel();
  document.getElementById('chart-label').textContent = `Hourly spend — last ${rl}`;
  document.querySelectorAll('.range-label').forEach(el => {
    el.textContent = el.textContent.replace(/—\s*\S+$/, `— ${rl}`);
  });
  document.body.classList.add('loading');
  Promise.all([load(), loadBreakdown(), loadSavings(), loadProjectCosts(), loadSessions()])
    .finally(() => {
      document.body.classList.remove('loading');
      document.getElementById('last-refresh').textContent = 'updated ' + new Date().toLocaleTimeString();
    });
}

function exportCSV() {
  const range = rangeParam();
  window.open(`/api/export?range=${range}&format=csv`, '_blank');
}

document.getElementById('range-select').addEventListener('change', refreshAll);

refreshAll();
loadTrend();
loadJudge();
loadHealth();
setInterval(refreshAll, 60000);
setInterval(loadTrend, 120000);
setInterval(loadJudge, 60000);
setInterval(loadHealth, 15000);
</script>
</body>
</html>
