# Watchdog runtime config. Sourced by watchdog.sh on every tick.
# Copy to ~/.config/llm-token-proxy/watchdog.conf and edit. Re-read every tick.

# --- Endpoints ---
PROXY_HEALTH_URL="http://127.0.0.1:4100/health"
PROXY_CHAT_URL="http://127.0.0.1:4100/v1/chat/completions"

# --- Test request ---
# Minimum-viable model that exists on your upstream and supports OpenAI-style
# /v1/chat/completions. Pick a Haiku-class model to keep tick cost tiny.
TEST_MODEL="claude-haiku-4-5"
TEST_TIMEOUT=12

# --- Auth ---
# Option A: pass the key directly (NOT recommended; this file is sourced as bash):
# TEST_API_KEY="sk-..."
#
# Option B (recommended): point at a key=value env file with mode 600 and tell
# the watchdog the variable name to look up.
RUNTIME_ENV_FILE="$HOME/.config/llm-token-proxy/runtime.env"
TEST_API_KEY_VAR="LLM_API_KEY"

# --- State transition hooks (optional) ---
# Run an executable when the watchdog flips PASS→FAIL or FAIL→PASS.
# Receives one arg: PASS or FAIL. Use this to flip your consumer configs
# (e.g., rewrite ANTHROPIC_BASE_URL on the client side) without coupling
# the watchdog to your specific stack.
# WATCHDOG_ON_FAIL_HOOK="$HOME/llm-token-proxy/scripts/your-fail-hook.sh"
# WATCHDOG_ON_PASS_HOOK="$HOME/llm-token-proxy/scripts/your-pass-hook.sh"

# --- Operator overrides ---
DISABLE_FLAG="$HOME/.token-proxy-watchdog-disabled"
MAINTENANCE_FLAG="$HOME/.token-proxy-maintenance"
MAINTENANCE_TTL_SECONDS=300

# --- Output paths ---
LOG_FILE="$HOME/.token-proxy-watchdog.log"
ALERT_FILE="$HOME/.token-proxy-watchdog-alert"
LAST_RESULT_FILE="$HOME/.token-proxy-watchdog-last"
