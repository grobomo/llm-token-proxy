<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Tracker</title>
  <style>
    :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --accent: #58a6ff; --muted: #8b949e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px; width: 320px; text-align: center; }
    h1 { font-size: 18px; color: var(--accent); margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    input { width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 16px; text-align: center; letter-spacing: 2px; }
    input:focus { outline: none; border-color: var(--accent); }
    input::placeholder { color: var(--muted); letter-spacing: normal; }
    button { width: 100%; padding: 12px; margin-top: 16px; background: var(--accent); color: #000; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .error { color: #f85149; font-size: 12px; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Token Tracker</h1>
    <p class="subtitle">Enter password to continue</p>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="password" autofocus autocomplete="current-password">
      <button type="submit">Open Dashboard</button>
    </form>
    <p class="error" id="err">Incorrect password</p>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('pw').value;
      const r = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw }),
      });
      if (r.ok) {
        window.location.href = '/dashboard';
      } else {
        document.getElementById('err').style.display = 'block';
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
      }
    });
  </script>
</body>
</html>
