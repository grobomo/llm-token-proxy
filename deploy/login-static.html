<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Tracker — Login</title>
  <style>
    body { font-family: -apple-system, monospace; background: #0d1117; color: #e6edf3; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 32px; width: 300px; text-align: center; }
    h1 { font-size: 18px; color: #58a6ff; margin: 0 0 16px; }
    input { width: 100%; padding: 10px; background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px; font-size: 14px; box-sizing: border-box; margin-bottom: 12px; }
    button { width: 100%; padding: 10px; background: #238636; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
    button:hover { background: #2ea043; }
    .error { color: #f85149; font-size: 12px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Token Tracker</h1>
    <form id="login-form">
      <input type="password" id="pw" placeholder="Password" autofocus />
      <button type="submit">Sign in</button>
      <div class="error" id="err">Wrong password</div>
    </form>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var pw = document.getElementById('pw').value;
      var enc = new TextEncoder().encode(pw);
      crypto.subtle.digest('SHA-256', enc).then(function(buf) {
        var hash = Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
        document.cookie = 'dash_auth=' + hash + '; path=/; max-age=86400; SameSite=Strict; Secure';
        window.location.href = '/';
      });
    });
  </script>
</body>
</html>
